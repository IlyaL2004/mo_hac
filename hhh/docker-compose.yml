#version: '3.8'


services:

  kafka-broker1:
    image: apache/kafka:latest
    hostname: kafka-broker1
    container_name: kafka-broker1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker1:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,HOST://:9092,DOCKER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka-broker1:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 16
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - kafka-spark-network

  kafka-ui6:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui6
    depends_on:
      - kafka-broker1
    ports:
      - "8090:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "Single Node Kafka"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-broker1:9093"
    networks:
      - kafka-spark-network

  minio6:
    image: quay.io/minio/minio:latest
    container_name: minio6
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - kafka-spark-network

  kafka-connect6:
    image: confluentinc/cp-kafka-connect:latest
    hostname: kafka-connect6
    container_name: kafka-connect6
    depends_on:
      - kafka-broker1
      - postgres
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka-broker1:9093"
      CONNECT_GROUP_ID: "kafka-connect-cluster"
      CONNECT_CONFIG_STORAGE_TOPIC: "_connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "_connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "_connect-status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect6"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    command:
      - bash
      - -c
      - |
        confluent-hub install --no-prompt confluentinc/kafka-connect-jdbc:latest &&
        confluent-hub install --no-prompt confluentinc/kafka-connect-s3:latest &&
        /etc/confluent/docker/run
    networks:
      - kafka-spark-network

  init-kafka-connect6:
    image: curlimages/curl:latest
    depends_on:
      - kafka-connect6
    volumes:
      - .:/workspace
    command: >
      bash -c "
        echo 'Waiting for Kafka Connect REST API to be available...'
        until curl -f http://kafka-connect6:8083/connectors; do
          echo 'Kafka Connect is not ready yet. Waiting...'
          sleep 5
        done
        echo 'Kafka Connect is available. Creating connectors...'

        # Создаем S3 коннектор
        curl -X POST http://kafka-connect6:8083/connectors -H 'Content-Type: application/json' -d @/workspace/s3-connector.json
        echo 'S3 connector created'

      "
    restart: "no"
    networks:
      - kafka-spark-network

  postgres:
    image: debezium/postgres:14
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
    networks:
      - kafka-spark-network

  connect:
    image: debezium/connect:2.3
    depends_on:
      - kafka-broker1
      - postgres
    environment:
      BOOTSTRAP_SERVERS: kafka-broker1:9093  # Исправлено
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    ports:
      - "8084:8083"  # Изменен порт на 8084
    networks:
      - kafka-spark-network  # Исправлена сеть
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/" ]
      interval: 10s
      timeout: 5s
      retries: 10

  connect-setup:
    image: curlimages/curl:8.5.0
    depends_on:
      connect:
        condition: service_healthy
    volumes:
      - ./connector-config.json:/connector-config.json
    entrypoint:
      - sh
      - -c
      - |
        until curl -s http://connect:8083/; do
          echo "Waiting for Kafka Connect..."
          sleep 2
        done
        curl -X POST -H "Content-Type: application/json" --data @/connector-config.json http://connect:8083/connectors
    networks:
      - kafka-spark-network

  clickhouse:
    image: clickhouse/clickhouse-server:23.3
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --host localhost --query \"SELECT 1\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kafka-spark-network

  clickhouse-init:
    image: clickhouse/clickhouse-server:23.3
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse-init/init.sql:/init.sql:ro
    entrypoint:
      - bash
      - -c
      - |
        until clickhouse-client --host clickhouse --query "SELECT 1"; do
          echo "Waiting for ClickHouse..."
          sleep 2
        done
        clickhouse-client --host clickhouse --multiquery < /init.sql
    networks:
      - kafka-spark-network

  superset:
    image: apache/superset:4.0.1
    ports:
      - "8088:8088"
    networks:
      - kafka-spark-network
    depends_on:
      - clickhouse
    environment:
      SUPERSET_SECRET_KEY: your-secret-key
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset-data:/app/superset_home
    command: >
      bash -c "
      pip install -i https://pypi.tuna.tsinghua.edu.cn/simple clickhouse-connect==0.6.20 &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.com --password admin &&
      superset init &&
      /usr/bin/run-server.sh
      "

networks:
  kafka-spark-network:
    driver: bridge

volumes:
  postgres-data:
  clickhouse-data:
  superset-data: